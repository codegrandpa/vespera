<script src="assets/vespera.js?v=2"></script>
<script>
(function(){
  "use strict";
  var $ = Vespera.$, $$ = Vespera.$$;
  var mdToHtml = Vespera.mdToHtml;
  var id = new URLSearchParams(location.search).get("id");

  fetch("data/posts.json?v=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(db){
      var posts = (db.posts || []).slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
      var p = posts.filter(function(x){ return x.id === id; })[0] || posts[0];
      if(!p){
        document.getElementById("pBody").innerHTML = "<p>未找到文章。</p>";
        return;
      }
      document.title = p.title + " — VESPERA 晚调";
      document.getElementById("pDate").textContent = p.date;
      document.getElementById("pTitle").textContent = p.title;
      document.getElementById("pTags").innerHTML =
        (p.tags||[]).map(function(t){ return '<span class="tag">'+t+'</span>'; }).join("");
      document.getElementById("pRead").textContent = p.read || "";
      if(p.cover){
        var c = document.getElementById("pCover");
        c.src = p.cover;
        c.style.display = "block";
      }
      renderBody(p);
      renderNav(posts, p);
    })
    .catch(function(){
      document.getElementById("pBody").innerHTML = "<p>未能加载 data/posts.json。</p>";
    });

  function renderBody(p){
    var body = document.getElementById("pBody");
    if(p.file){
      fetch(p.file)
        .then(function(r){ return r.text(); })
        .then(function(md){ body.innerHTML = mdToHtml(md); })
        .catch(function(){ body.innerHTML = mdToHtml(p.content || ""); });
    } else {
      body.innerHTML = mdToHtml(p.content || "");
    }
  }
  function renderNav(posts, cur){
    var i = posts.findIndex(function(x){ return x.id === cur.id; });
    var prev = posts[i+1], next = posts[i-1];
    var html = "";
    if(prev){
      html += '<a href="post.html?id='+encodeURIComponent(prev.id)+'"><span class="dir">← 上一篇</span><b>'+prev.title+'</b></a>';
    } else {
      html += '<a style="visibility:hidden"></a>';
    }
    if(next){
      html += '<a class="next" href="post.html?id='+encodeURIComponent(next.id)+'"><span class="dir">下一篇 →</span><b>'+next.title+'</b></a>';
    }
    document.getElementById("pNav").innerHTML = html;
  }
})();
</script>
</body>
